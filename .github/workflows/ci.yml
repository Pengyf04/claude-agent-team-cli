name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: brew install shellcheck
      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh skills/agent-team-cli/scripts/*.sh
      - name: run tests
        run: bash tests/run.sh
